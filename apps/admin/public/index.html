<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pig Cloud · 管理后台</title>
    <link rel="stylesheet" href="/admin/style.css" />
  </head>
  <body>
    <header>
      <strong>P / Pig Cloud</strong><span>管理后台 · 本地内测</span
      ><a href="/debug/runs">执行链路诊断 ↗</a><button id="logout">退出</button>
    </header>
    <main>
      <section id="login">
        <h1>管理执行平台</h1>
        <p>
          使用 data/cloud-local/access.txt
          中的管理员令牌。后台操作会写入审计记录。
        </p>
        <form id="login-form">
          <input
            id="token"
            type="password"
            placeholder="管理员访问令牌"
            required
          /><button>连接平台</button>
        </form>
      </section>
      <p id="error" role="alert"></p>
      <section id="dashboard" hidden>
        <div class="heading">
          <div>
            <small>PLATFORM OVERVIEW</small>
            <h1>运行概览</h1>
          </div>
          <span id="mode"></span>
        </div>
        <div id="counts" class="cards"></div>
        <h2>账号与配额</h2>
        <form id="invite-form" class="panel">
          <input
            id="invite-name"
            placeholder="新账号名称"
            required
            maxlength="80"
          /><button>创建 24 小时邀请</button
          ><output id="invite-result"></output>
        </form>
        <label
          ><input id="show-disabled" type="checkbox" /> 显示已禁用账号</label
        >
        <div id="accounts" class="panel"></div>
        <h2>模型渠道</h2>
        <p>
          密钥加密保存，仅网关使用。启用渠道后远端任务使用真实模型；停用全部渠道则使用部署默认模型。
        </p>
        <form id="channel-form" class="panel">
          <input
            id="channel-name"
            placeholder="渠道名称"
            required
            maxlength="80"
          />
          <input
            id="channel-base"
            type="url"
            placeholder="https://api.deepseek.com/v1"
            required
          />
          <input
            id="channel-model"
            placeholder="deepseek-chat"
            required
            maxlength="100"
          />
          <input
            id="channel-key"
            type="password"
            placeholder="模型 API Key"
            required
            autocomplete="off"
          />
          <button>加密保存渠道</button>
        </form>
        <div id="channels" class="panel"></div>
        <h2>执行资源</h2>
        <form id="resource-form" class="panel">
          <label
            >新任务容器规格
            <select id="resource-profile">
              <option value="compact">轻量 · 0.5 CPU / 256 MiB / 2 分钟</option>
              <option value="standard">标准 · 1 CPU / 512 MiB / 4 分钟</option>
              <option value="large">扩展 · 2 CPU / 1024 MiB / 10 分钟</option>
            </select></label
          ><button>应用到后续任务</button>
          <p>
            固定受控镜像，容器非
            root、只读根文件系统、独立网络；已运行任务保持原规格。
          </p>
        </form>
        <h2>执行节点</h2>
        <div id="workers" class="panel"></div>
        <h2>最近任务</h2>
        <div class="panel">
          <table>
            <thead>
              <tr>
                <th>任务</th>
                <th>账号</th>
                <th>状态</th>
                <th>模型调用</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="runs"></tbody>
          </table>
        </div>
        <h2>控制面定时计划</h2>
        <div id="schedules" class="panel"></div>
        <h2>操作审计</h2>
        <div id="audit" class="panel"></div>
        <h2>任务详情</h2>
        <pre id="detail" class="panel">选择任务查看详情</pre>
      </section>
    </main>
    <script type="module" src="/admin/app.js"></script>
  </body>
</html>
