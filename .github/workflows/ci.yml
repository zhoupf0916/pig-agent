name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04 runners restrict unprivileged user namespaces via AppArmor, so bubblewrap
      # cannot configure loopback in its net namespace ("Failed RTM_NEWADDR: Operation not permitted").
      - name: Allow unprivileged user namespaces for bubblewrap
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: pnpm eval:context
      - run: pnpm test
      - run: pnpm desktop:build
