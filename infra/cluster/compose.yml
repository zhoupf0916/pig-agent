name: pig-agent-cluster
x-cloud: &cloud
  image: pig-agent-cluster-cloud:local
  build: { context: ../../cloud-dist, dockerfile: ../infra/cloud/Dockerfile, target: cloud }
  environment: &control-env
    DATABASE_URL: postgres://pig:${DB_PASSWORD}@postgres:5432/pig
    ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ADMIN_TOKEN: ${ADMIN_TOKEN}
    MEMBER_TOKEN: ${MEMBER_TOKEN}
    MEMBER2_TOKEN: ${MEMBER2_TOKEN}
    WORKER_TOKEN: ${WORKER_TOKEN}
    MODEL_MODE: mock
    WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-}
  networks: [control, egress]
  depends_on:
    postgres: { condition: service_healthy }
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:8890/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 3s
    timeout: 3s
    retries: 20
x-worker: &worker
  image: pig-agent-cluster-worker:local
  build: { context: ../../cloud-dist, dockerfile: ../infra/cloud/Dockerfile, target: worker }
  environment: &worker-env
    CONTROL_URL: http://control:8890
    WORKER_TOKEN: ${WORKER_TOKEN}
    WORKER_CAPACITY: 2
    WORKER_NAMESPACE: pig-agent-cluster
  volumes: ["worker-outbox:/app/data/worker-outbox"]
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true", "seccomp=../cloud/runner-seccomp.json", "systempaths=unconfined"]
  mem_limit: 4g
  pids_limit: 1024
  networks: [control]
  stop_grace_period: 40s
  depends_on:
    worker-storage-init: { condition: service_completed_successfully }
    control: { condition: service_started }
    gateway: { condition: service_started }
services:
  worker-storage-init:
    image: pig-agent-cluster-worker:local
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/outbox"]
    volumes: ["worker-outbox:/outbox"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: pig, POSTGRES_DB: pig, POSTGRES_PASSWORD: "${DB_PASSWORD}" }
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pig]
      interval: 3s
      timeout: 3s
      retries: 20
  cloud-a:
    <<: *cloud
    ports: ["127.0.0.1:8893:8890"]
  cloud-b:
    <<: *cloud
    ports: ["127.0.0.1:8894:8890"]
  control:
    image: nginx:1.28-alpine
    # Directory mount survives atomic editor replacements of nginx.conf.
    volumes: ["./:/etc/pig-cluster:ro"]
    command: [nginx, -c, /etc/pig-cluster/nginx.conf, -g, "daemon off;"]
    ports: ["127.0.0.1:8892:8890"]
    networks: [control, ingress]
    # Resolve Docker service aliases only; never forward vanished names to host fake-IP DNS.
    dns: [127.0.0.1]
    depends_on:
      cloud-a: { condition: service_healthy }
      cloud-b: { condition: service_healthy }
  gateway:
    image: pig-agent-cluster-gateway:local
    build: { context: ../../cloud-dist, dockerfile: ../infra/cloud/Dockerfile, target: gateway }
    environment:
      NETWORK_DNS_MODE: public
      CONTROL_URL: http://control:8890
      WORKER_TOKEN: ${WORKER_TOKEN}
      MODEL_MODE: mock
    networks: [control, egress]
    depends_on: [control]
  runner-a:
    <<: *worker
    hostname: pig-cluster-runner-a
  runner-b:
    <<: *worker
    hostname: pig-cluster-runner-b
volumes:
  worker-outbox:
  database:
networks:
  control:
    internal: true
  egress:
  ingress:
