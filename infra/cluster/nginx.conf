events {}
http {
  # Compose disables external DNS forwarding for this proxy. Docker service
  # aliases resolve normally, but vanished aliases cannot become host fake IPs.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 1s;
  upstream planes {
    zone planes 64k;
    server cloud-a:8890 resolve max_fails=1 fail_timeout=3s;
    server cloud-b:8890 resolve max_fails=1 fail_timeout=3s;
  }
  server {
    listen 8890;
    client_max_body_size 7m;
    location / {
      proxy_pass http://planes;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_connect_timeout 2s;
      # Do not replay a POST after it may have committed upstream.
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
