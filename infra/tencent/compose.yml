# Overlay for a four-GB single-host deployment. Database and API stay private.
#
# Memory budget (host: 3718 MiB usable). Container limits are ceilings, not reservations, so their sum
# must leave room for the OS, dockerd, Nginx and page cache:
#   postgres 448 + cloud 448 + minio 256 + gateway 192 + 4 runners x RUNNER_MEM_LIMIT (512) = 3392 MiB
#   (~325 MiB headroom; measured usage is far below the ceilings, see docs/object-storage.md)
# If the host still runs out of memory, oom_score_adj makes the kernel kill runner (task) processes
# first and stateful services last. Runners also stop claiming new work while their own container is
# >=85% of its limit or host MemAvailable drops below WORKER_MIN_HOST_AVAILABLE_MB.
services:
  postgres:
    restart: unless-stopped
    mem_limit: 448m
    oom_score_adj: -900
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  cloud:
    # Only image construction uses host networking; running services stay bridged.
    build:
      network: host
    restart: unless-stopped
    mem_limit: 448m
    oom_score_adj: -500
    logging: *logs
    networks: [control, egress, storage]
    environment:
      # Production: the admin env bearer expires 24h after it is first configured (rotate the value in
      # stack.env to open a new window); the demo/test bearer accounts are revoked and member2 is disabled.
      BOOTSTRAP_TOKEN_TTL_HOURS: "24"
      MEMBER_TOKEN: ""
      MEMBER2_TOKEN: ""
      # Host Nginx overwrites X-Forwarded-For with $remote_addr; auth throttling keys on it.
      TRUST_PROXY_HEADER: x-forwarded-for
      # Outbound webhooks resolve through the same fixed-IP DNS as the gateway; addresses are still
      # screened (public IPv4 only) and pinned per delivery.
      NETWORK_DNS_MODE: public
      NETWORK_DNS_PROVIDER: alidns
  minio:
    restart: unless-stopped
    mem_limit: 256m
    oom_score_adj: -800
    logging: *logs
    environment:
      # Keep the Go heap under the container ceiling.
      GOMEMLIMIT: 200MiB
  gateway:
    build:
      network: host
    restart: unless-stopped
    environment:
      # Fixed-IP encrypted DNS is reachable from this host; TLS remains verified.
      # Target addresses are still screened for SSRF and pinned before connecting.
      NETWORK_DNS_MODE: public
      NETWORK_DNS_PROVIDER: alidns
    mem_limit: 192m
    oom_score_adj: -500
    logging: *logs
  worker:
    build:
      network: host
    restart: unless-stopped
    hostname: pig-tencent-runner
    environment:
      WORKER_CAPACITY: "1"
      WORKER_PROFILES: "compact,standard"
      WORKER_MIN_HOST_AVAILABLE_MB: "400"
    mem_limit: ${RUNNER_MEM_LIMIT:-512m}
    oom_score_adj: 500
    cpus: 1.0
    stop_grace_period: 40s
    logging: *logs
  runner-b: &additional-runner
    extends:
      file: ../cloud/compose.yml
      service: worker
    build:
      network: host
    hostname: pig-tencent-runner-b
    restart: unless-stopped
    environment:
      WORKER_CAPACITY: "1"
      WORKER_PROFILES: "compact,standard"
      WORKER_MIN_HOST_AVAILABLE_MB: "400"
    mem_limit: ${RUNNER_MEM_LIMIT:-512m}
    oom_score_adj: 500
    cpus: 1.0
    stop_grace_period: 40s
    logging: *logs
  runner-c:
    <<: *additional-runner
    hostname: pig-tencent-runner-c
  runner-d:
    <<: *additional-runner
    hostname: pig-tencent-runner-d
networks:
  control:
    name: pig-agent-public-control
    internal: true
    driver_opts: { com.docker.network.driver.mtu: "1450" }
  storage:
    name: pig-agent-public-storage
    internal: true
    driver_opts: { com.docker.network.driver.mtu: "1450" }
  egress:
    name: pig-agent-public-egress
    driver_opts: { com.docker.network.driver.mtu: "1450" }
