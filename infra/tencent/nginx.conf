# Loaded inside nginx http {}. Empty keys exclude static assets and SSE lifetime.
map $uri $pig_api_ip { default ""; ~^/v1/ $binary_remote_addr; }
map $uri $pig_auth_ip { default ""; ~^/auth/web/(login|register|invite)$ $binary_remote_addr; }
limit_req_zone $pig_api_ip zone=pig_api:10m rate=10r/s;
limit_req_zone $pig_auth_ip zone=pig_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=pig_connections:10m;
# Do not advertise the nginx version (http-level; this file is included inside http {}).
server_tokens off;

# Replace this IP and certificate paths for another deployment.
server {
    listen 80;
    server_name 193.112.22.18;
    location ^~ /.well-known/acme-challenge/ { root /var/www/pig-acme; }
    location / { return 308 https://193.112.22.18$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name 193.112.22.18;
    ssl_certificate /etc/letsencrypt/live/193.112.22.18/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/193.112.22.18/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=pig_api burst=30 nodelay;
    limit_req zone=pig_auth burst=5 nodelay;
    limit_conn pig_connections 40;
    error_page 429 = @pig_rate_limited;
    location @pig_rate_limited {
        default_type application/json;
        add_header Retry-After 15 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":"请求过于频繁，请稍后重试"}';
    }
    # Security headers. nginx drops server-level add_header in any location that sets its own,
    # so /assets/ below repeats them; keep both lists identical (apps/web/src/deploy-headers.test.ts checks).
    # CSP: the one inline <script> in apps/web/index.html (theme bootstrap) is allowed by hash.
    # Browsers ignore HSTS for IP-literal hosts; it takes effect once a domain name is used.
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Yul+DZ15GV/SMyV1CjjYevY7i1Ohtm+z/zAQfp7U3yg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location ^~ /internal/ { return 404; }
    # Vite assets are content-hashed: compress (static files only; API/SSE stay uncompressed to avoid
    # BREACH-style leaks and buffering) and cache for a year.
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        gzip on;
        gzip_proxied any;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript image/svg+xml application/json;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Yul+DZ15GV/SMyV1CjjYevY7i1Ohtm+z/zAQfp7U3yg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }
    location / {
        proxy_pass http://127.0.0.1:8890;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_next_upstream off;
    }
}
