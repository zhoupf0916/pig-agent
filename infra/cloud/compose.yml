name: pig-agent-cloud
services:
  worker-storage-init:
    image: pig-agent-worker:local
    user: "0:0"
    command: ["chown", "-R", "1000:1000", "/outbox"]
    volumes: ["worker-outbox:/outbox"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pig
      POSTGRES_DB: pig
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run pnpm cloud:setup}
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pig"]
      interval: 3s
      timeout: 3s
      retries: 20
  cloud:
    image: pig-agent-cloud:local
    build:
      {
        context: ../../cloud-dist,
        dockerfile: ../infra/cloud/Dockerfile,
        target: cloud,
      }
    environment:
      DATABASE_URL: postgres://pig:${DB_PASSWORD}@postgres:5432/pig
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run pnpm cloud:setup}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      MEMBER_TOKEN: ${MEMBER_TOKEN}
      MEMBER2_TOKEN: ${MEMBER2_TOKEN}
      WORKER_TOKEN: ${WORKER_TOKEN}
      MODEL_MODE: ${MODEL_MODE:-mock}
      WEB_PUBLIC_ORIGIN: ${WEB_PUBLIC_ORIGIN:-}
    ports: ["127.0.0.1:8890:8890"]
    networks: [control]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8890/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
  gateway:
    image: pig-agent-gateway:local
    build:
      {
        context: ../../cloud-dist,
        dockerfile: ../infra/cloud/Dockerfile,
        target: gateway,
      }
    environment:
      NETWORK_DNS_MODE: public
      CONTROL_URL: http://cloud:8890
      WORKER_TOKEN: ${WORKER_TOKEN}
      MODEL_MODE: ${MODEL_MODE:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com/v1}
      MODEL_NAME: ${MODEL_NAME:-deepseek-chat}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    networks: [control, egress]
    depends_on:
      cloud: { condition: service_healthy }
  worker:
    image: pig-agent-worker:local
    build:
      {
        context: ../../cloud-dist,
        dockerfile: ../infra/cloud/Dockerfile,
        target: worker,
      }
    hostname: pig-worker-local
    environment:
      CONTROL_URL: http://cloud:8890
      WORKER_TOKEN: ${WORKER_TOKEN}
    volumes: ["worker-outbox:/app/data/worker-outbox"]
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true", "apparmor=unconfined", "seccomp=./runner-seccomp.json", "systempaths=unconfined"]
    mem_limit: 4g
    pids_limit: 1024
    networks: [control]
    depends_on:
      worker-storage-init: { condition: service_completed_successfully }
      cloud: { condition: service_healthy }
      gateway: { condition: service_started }
volumes:
  worker-outbox:
  database:
networks:
  control:
  egress:
